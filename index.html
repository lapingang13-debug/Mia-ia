
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0912">
<title>Mia IA</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0912;color:#f5f0ff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh}
header{padding:24px 20px;border-bottom:1px solid #30213f;display:flex;align-items:center;gap:14px}
.logo{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#bd76ff,#5724a0);display:grid;place-items:center;font-size:24px;box-shadow:0 0 24px #9b4dff55}
h1{margin:0;font-size:25px;letter-spacing:2px}
small{color:#bd9cde}
main{max-width:650px;margin:auto;padding:22px 16px}
.status{color:#bc8cff;font-size:13px;margin-bottom:20px}
.avatar{height:190px;border:1px solid #5d3182;border-radius:24px;background:radial-gradient(ellipse at center,#382052 0%,#171020 48%,#0b0912 75%);display:grid;place-items:center;margin-bottom:22px}
.avatar span{font-size:76px;filter:drop-shadow(0 0 20px #b65cff)}
h2{font-size:20px;margin:0 0 8px}
p{color:#c6bbd3;line-height:1.5}
.chat{border:1px solid #39234e;border-radius:18px;padding:16px;background:#110d1a;min-height:150px}
#messages{white-space:pre-wrap;line-height:1.5}
form{display:flex;gap:8px;margin-top:14px}
input{min-width:0;flex:1;background:#0b0912;color:white;border:1px solid #65418a;border-radius:12px;padding:14px;font-size:16px}
button{background:#8e42d6;color:white;border:0;border-radius:12px;padding:12px 16px;font-size:15px}
.actions{display:flex;gap:10px;margin-top:12px}
.actions button{flex:1;background:#241633;border:1px solid #54336f}
footer{text-align:center;color:#766681;font-size:12px;padding:28px}
</style>
</head>
<body>
<header>
<div class="logo">M</div>
<div><h1>MIA IA</h1><small>ASSISTANTE PERSONNELLE</small></div>
</header>
<main>
<div class="status">● INTERFACE EN LIGNE</div>
<div class="avatar"><span>✧</span></div>
<h2>Salut Lapin.</h2>
<p>Je suis Mia. Mon interface est prête. Écris-moi pour commencer.</p>
<div class="chat">
<div id="messages">Mia : Bonjour. Je suis là. Que veux-tu faire aujourd'hui ?</div>
<form id="chatForm">
<input id="message" placeholder="Parle à Mia…" autocomplete="off">
<button type="submit">Envoyer</button>
</form>
<div class="actions">
<button id="voice">🎙 Dictée</button>
<button id="clear">Effacer le chat</button>
</div>
</div>
</main>
<footer>MIA IA · Prototype personnel</footer>
<script>
const messages=document.getElementById('messages');
const input=document.getElementById('message');
document.getElementById('chatForm').addEventListener('submit',e=>{
e.preventDefault();
const text=input.value.trim();
if(!text)return;
messages.textContent+='\n\nToi : '+text+'\n\nMia : Ton message est reçu. Cette version est un prototype : connectons ensuite un véritable moteur IA pour que je puisse te répondre intelligemment.';
input.value='';
});
document.getElementById('clear').onclick=()=>{messages.textContent='Mia : Bonjour. Je suis là. Que veux-tu faire aujourd’hui ?';};
document.getElementById('voice').onclick=()=>{
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SpeechRecognition){alert('La dictée vocale dépend du navigateur. Utilise le micro du clavier iPhone.');return;}
const recognition=new SpeechRecognition();
recognition.lang='fr-FR';
recognition.onresult=e=>{input.value=e.results[0][0].transcript;};
recognition.start();
};
</script>
</body>
</html>
